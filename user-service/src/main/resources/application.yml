server:
  port: 8002

spring:
  application:
    name: user-service
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      password: password
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5332/postgres
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
